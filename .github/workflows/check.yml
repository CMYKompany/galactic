name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mpy-cross pillow pyflakes
      - run: sudo apt-get install -y ffmpeg
      - run: tools/check.sh
